# compose.yaml
#
# Please refer https://aka.ms/HTTPSinContainer on how to setup
# an https developer certificate for your ASP.NET Core service.

services:
  blazorshorturl:
    image: blazorshorturl
    build:
      context: .
      dockerfile: ./Dockerfile
    # env_file: .env
    group_add:
      - "$PODMAN_SOCK_GID"
    environment:
      - BUILD_PLATFORM=$APP_PLATFORM
      - ASPNETCORE_ENVIRONMENT=$APP_ENVIRONMENT
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=$APP_FORWARD_HEADERS
      - ASPNETCORE_HTTP_PORTS=$ASPNETCORE_HTTP_PORTS
      # - ASPNETCORE_URLS=$ASPNETCORE_URLS
      - AppDbContext=$AppDbContext
      - DataContext=$DataContext
      - ADMIN_EMAIL=$ADMIN_EMAIL
      - ADMIN_PASSWORD=$ADMIN_PASSWORD
      - API_KEY=$API_KEY
      - APP_UID:$APP_UID
      - BASE_ADDRESS=$BASE_ADDRESS
      - LOG_LEVEL:$LOG_LEVEL

# ports:
#   - $APP_SERVER_PORT:$APP_SERVER_PORT

# volumes:
#   - /opt/BlazorShortUrl/logs:/logs

networks:
  default:
    name: dockhand
    external: true
